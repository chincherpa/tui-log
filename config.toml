# tui-log Konfiguration
# Alle Farben als Hex-Werte (#RRGGBB)

[schedule]
work_start       = "06:00"
work_end         = "15:00"
handover_window  = 15        # Minuten nach work_end

[projects]
active = ["Gartenhaus", "Hochbeet", "Foto-Archiv"]

# ── TAGS ─────────────────────────────────────────────────────────────────────
# Jeder Tag: symbol, name, color (hex), active (bool)

[tags.work]
done   = { symbol = "✓",  name = "Erledigt",   color = "#00C896", active = true }
start  = { symbol = "▶",  name = "Gestartet",  color = "#5B8DEF", active = true }
block  = { symbol = "✕",  name = "Blockiert",  color = "#FF6B6B", active = true }
idea   = { symbol = "💡", name = "Idee",       color = "#C77DFF", active = true }
fix    = { symbol = "⚡", name = "Fix",        color = "#FFD93D", active = true }
urgent = { symbol = "🔥", name = "Wichtig",    color = "#F03E3E", active = true }
wait   = { symbol = "⏳", name = "Warten",     color = "#CED4DA", active = true }
review = { symbol = "👁",  name = "Review",     color = "#339AF0", active = true }
plan   = { symbol = "📅", name = "Geplant",    color = "#94D82D", active = true }

[tags.any]
note   = { symbol = "🗒️",  name = "Notiz",      color = "#D0D0D0", active = true }
